name: Check
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: work/models
          key: retrieval-models-bge-small-clip-base-v1
      - run: npm run eval:check
